info:
  name: Refresh
  type: http
  seq: 5

http:
  method: POST
  url: "{{base-url}}/api/auth/refresh/"
  body:
    type: json
    data: |-
      {
        "refresh": "{{refreshToken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |
        bru.setEnvVar("accessToken", res.body.access);

tests: |
  test("status is 200", function() {
    expect(res.status).to.equal(200);
  });

  test("returns new access token", function() {
    expect(res.body.access).to.be.a("string").and.not.empty;
  });

  test("does not return a refresh token", function() {
    expect(res.body.refresh).to.be.undefined;
  });
