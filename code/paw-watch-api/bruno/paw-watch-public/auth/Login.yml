info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{base-url}}/api/auth/login/"
  body:
    type: json
    data: |-
      {
        "email": "west@email.com",
        "password": "west123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("accessToken", res.body.access);
        bru.setEnvVar("refreshToken", res.body.refresh);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
