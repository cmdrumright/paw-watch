info:
  name: Logout
  type: http
  seq: 6

http:
  method: POST
  url: "{{base-url}}/api/auth/logout/"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "refresh": "{{refreshToken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |
  test("status is 204", function() {
    expect(res.status).to.equal(204);
  });
