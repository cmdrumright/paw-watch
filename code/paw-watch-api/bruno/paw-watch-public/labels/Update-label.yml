info:
  name: Update label
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base-url}}/api/labels/{{createdLabelId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Renamed Label"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |
  test("status is 200", function() {
    expect(res.status).to.equal(200);
  });

  test("returns updated name", function() {
    expect(res.body.name).to.equal("Renamed Label");
  });
