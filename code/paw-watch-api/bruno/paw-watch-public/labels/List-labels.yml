info:
  name: List labels
  type: http
  seq: 1

http:
  method: GET
  url: "{{base-url}}/api/labels"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |
  test("status is 200", function() {
    expect(res.status).to.equal(200);
  });

  test("returns an array of labels", function() {
    expect(res.body).to.be.an("array");
  });

  test("returns 17 labels", function() {
    expect(res.body.length).to.equal(17);
  });

  test("each label has id and name", function() {
    res.body.forEach(label => {
      expect(label).to.have.property("id");
      expect(label).to.have.property("name");
    });
  });
