opencollection: 1.0.0

info:
  name: paw-watch-public
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Authorization
      value: "Token "
      disabled: true
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
