info:
  name: Delete comment
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{base-url}}/api/comments/{{createdCommentId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |
  test("status is 204", function() {
    expect(res.status).to.equal(204);
  });
