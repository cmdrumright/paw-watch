info:
  name: List comments
  type: http
  seq: 1

http:
  method: GET
  url: "{{base-url}}/api/posts/{{createdPostId}}/comments"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |
  test("status is 200", function() {
    expect(res.status).to.equal(200);
  });

  test("returns an array", function() {
    expect(res.body).to.be.an("array");
  });
