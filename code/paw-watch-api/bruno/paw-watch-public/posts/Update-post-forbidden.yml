info:
  name: Update post - not owner
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{base-url}}/api/posts/2"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  auth: inherit
  body:
    type: multipart-form
    data:
      - name: pet_name
        type: text
        value: Hacked

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |
  test("status is 403", function() {
    expect(res.status).to.equal(403);
  });
